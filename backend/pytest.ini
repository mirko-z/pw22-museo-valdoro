[pytest]
# La cartella backend/ è la root dei moduli: "import app..." funziona nei test
pythonpath = .
testpaths = tests
# Cache di pytest in /tmp: nel container i test girano con l'utente non root "app", che non può scrivere in /app (avviso PytestCacheWarning). /tmp è scrivibile ovunque.
cache_dir = /tmp/museo-valdoro-pytest-cache
