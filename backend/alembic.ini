# Configurazione di Alembic (migrazioni dello schema del database).
# L'URL del database NON è qui: env.py lo legge da Settings (variabili d'ambiente),
# così le credenziali stanno solo nel file .env.

[alembic]
script_location = %(here)s/alembic
# Nomi dei file di migrazione: 0001_schema_iniziale.py, 0002_..., ecc.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
