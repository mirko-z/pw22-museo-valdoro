# nginx: server del front-end statico e reverse proxy verso il back-end.
# Browser e API condividono la stessa origine (stesso schema, host e porta),
# quindi il cookie del token viaggia senza CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non rivelare la versione di nginx nelle intestazioni e nelle pagine di errore
    server_tokens off;

    # Le API accettano solo corpi JSON piccoli
    client_max_body_size 1m;

    # Intestazioni di sicurezza (OWASP). La CSP consente solo risorse servite
    # da questa origine: niente script inline né CDN esterni (Bootstrap va
    # copiato in css/), così un eventuale XSS non può caricare codice esterno.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Il browser ricontrolla ogni file a ogni caricamento (risposta 304 se non è
    # cambiato): dopo un aggiornamento non restano in cache JS e CSS vecchi,
    # che mescolati ai file nuovi rompono l'interfaccia.
    add_header Cache-Control "no-cache" always;

    # Swagger UI di FastAPI carica CSS e JS da cdn.jsdelivr.net, l'icona da
    # fastapi.tiangolo.com e usa uno script inline: per questa sola pagina
    # (documentazione per sviluppatori) la CSP è allentata quanto basta.
    # Un add_header nel blocco location sostituisce quelli del server,
    # quindi le altre intestazioni vanno ripetute.
    location = /api/docs {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy: /api/... va al servizio "api" della rete di Compose.
    # proxy_pass senza percorso finale conserva l'URI originale (/api/...),
    # come si aspetta FastAPI.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File statici del front-end
    location / {
        try_files $uri $uri/ =404;
    }
}
