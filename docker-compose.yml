# Museo Civico di Valdoro – ambiente di esecuzione (Docker Compose)
#
# Tre servizi su una rete interna:
#   db  -> PostgreSQL 16 (memorizzazione persistente, transazioni, lock di riga)
#   api -> back-end FastAPI (logica di business, API REST)
#   web -> nginx: serve il front-end statico e fa da reverse proxy verso /api/
#
# Solo "web" pubblica una porta sull'host: api e db sono raggiungibili
# esclusivamente dagli altri container (superficie di attacco ridotta).

name: museo-valdoro

services:
  db:
    # Versioni esatte delle immagini: chi avvia il progetto in seguito ottiene lo stesso ambiente
    image: postgres:16.15-alpine3.24
    # 200 connessioni: l'esperimento sulla concorrenza apre fino a 100 connessioni
    # simultanee (una per thread), oltre a quelle dell'applicazione (default: 100)
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      # Volume nominato: i dati sopravvivono al riavvio e alla ricreazione del container
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "$$" evita che Compose sostituisca la variabile: la espande la shell del container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      # Dentro la rete di Compose il database si raggiunge con il nome del servizio
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      # Al primo avvio migrazioni e seed (hash bcrypt) richiedono qualche secondo:
      # in questo intervallo i controlli falliti non contano.
      start_period: 30s
    restart: unless-stopped

  web:
    image: nginx:1.30.6-alpine3.24
    ports:
      # Porta 8080 di default, per non entrare in conflitto con un server web
      # locale già in ascolto sulla 80 (es. Apache/XAMPP). Si cambia nel .env.
      - "${WEB_PORT:-8080}:80"
    volumes:
      # Si montano solo i file pubblici: nginx.conf resta fuori dalla document root
      # e quindi non è scaricabile dal browser.
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/pages:/usr/share/nginx/html/pages:ro
      - ./frontend/css:/usr/share/nginx/html/css:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/img:/usr/share/nginx/html/img:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
